[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rna-doublet-rate"
version = "0.1.0"
description = "RNA-only multi-detector doublet scores, calls, and predicted rates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anndata",
  "numpy",
  "pandas",
  "scanpy>=1.9",
  "scipy",
]

[project.optional-dependencies]
full = [
  "scrublet",
  "doubletdetection",
  "scvi-tools",
]

[project.scripts]
doublet-rate = "doublet_rate.run_doublet_rate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["doublet_rate*"]

[tool.setuptools.package-data]
doublet_rate = ["detectors_r.R"]
